id: xss-reflected-detection

info:
  name: Reflected XSS Detection (Rebel Methodology)
  author: watchdogs
  severity: medium
  description: Detects reflected XSS by checking for unencoded payload reflection
  reference:
    - https://github.com/salarrbl/cexss
  tags: xss, reflected, rce, rebel-methodology

variables:
  payload: "<b/cexss"
  detect: '"<b/cexss'

http:
  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payload}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "{{detect}}"
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payload}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cexss\"\""
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payload}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Accept-Language: en-US,en;q=0.5
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cexss''"
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500