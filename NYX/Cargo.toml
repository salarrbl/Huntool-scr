[workspace]
lints.clippy.new_without_default = "allow"
resolver = "2"
members = [
    "nyx-common",
    "nyx-crypto",
    "nyx-protocol",
    "nyx-storage",
    "nyx-core",
    "nyx-network",
    "nyx-config",
    "nyx-ui",
    "nyx-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Project NYX Contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/your-org/nyx"
rust-version = "1.75"

[workspace.dependencies]
thiserror = "2"
zeroize = { version = "1", features = ["derive", "alloc"] }
rand = "0.8"
rand_core = "0.6"
blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-socks = "0.5"
crossterm = "0.28"
ratatui = "0.29"
toml = "0.8"
proptest = "1"
async-trait = "0.1"
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

